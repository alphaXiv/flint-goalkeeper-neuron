[project]
name = "flint-self-interp"
version = "0.1.0"
description = "Activation labeling experiments for small language models and Recursive Flint"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.12",
  "datasets>=4.4",
  "json-repair>=0.55",
  "numpy>=2.1",
  "torch>=2.8",
  "transformers>=5.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["self_interp"]
